<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="376" height="376" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Header -->
  <rect x="24" y="24" width="352" height="48" rx="12" fill="#0f172a"/>
  <text x="200" y="54" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">ECK ALUMNI ASSOCIATION</text>

  <!-- Corner finder pattern Top-Left -->
  <rect x="50" y="90" width="70" height="70" rx="8" fill="none" stroke="#0f172a" stroke-width="10"/>
  <rect x="68" y="108" width="34" height="34" rx="4" fill="#0f172a"/>

  <!-- Corner finder pattern Top-Right -->
  <rect x="280" y="90" width="70" height="70" rx="8" fill="none" stroke="#0f172a" stroke-width="10"/>
  <rect x="298" y="108" width="34" height="34" rx="4" fill="#0f172a"/>

  <!-- Corner finder pattern Bottom-Left -->
  <rect x="50" y="250" width="70" height="70" rx="8" fill="none" stroke="#0f172a" stroke-width="10"/>
  <rect x="68" y="268" width="34" height="34" rx="4" fill="#0f172a"/>

  <!-- Stylized QR data matrix dots -->
  <g fill="#1e293b">
    <rect x="140" y="92" width="14" height="14" rx="3"/>
    <rect x="160" y="92" width="14" height="14" rx="3"/>
    <rect x="200" y="92" width="14" height="14" rx="3"/>
    <rect x="240" y="92" width="14" height="14" rx="3"/>
    <rect x="140" y="116" width="14" height="14" rx="3"/>
    <rect x="180" y="116" width="14" height="14" rx="3"/>
    <rect x="220" y="116" width="14" height="14" rx="3"/>
    <rect x="250" y="116" width="14" height="14" rx="3"/>

    <rect x="130" y="140" width="14" height="14" rx="3"/>
    <rect x="155" y="140" width="14" height="14" rx="3"/>
    <rect x="210" y="140" width="14" height="14" rx="3"/>
    <rect x="235" y="140" width="14" height="14" rx="3"/>

    <!-- Middle band -->
    <rect x="50" y="175" width="14" height="14" rx="3"/>
    <rect x="75" y="175" width="14" height="14" rx="3"/>
    <rect x="100" y="175" width="14" height="14" rx="3"/>
    <rect x="275" y="175" width="14" height="14" rx="3"/>
    <rect x="305" y="175" width="14" height="14" rx="3"/>
    <rect x="335" y="175" width="14" height="14" rx="3"/>

    <!-- Bottom area data dots -->
    <rect x="140" y="250" width="14" height="14" rx="3"/>
    <rect x="170" y="250" width="14" height="14" rx="3"/>
    <rect x="220" y="250" width="14" height="14" rx="3"/>
    <rect x="250" y="250" width="14" height="14" rx="3"/>
    <rect x="290" y="250" width="14" height="14" rx="3"/>
    <rect x="330" y="250" width="14" height="14" rx="3"/>

    <rect x="140" y="280" width="14" height="14" rx="3"/>
    <rect x="180" y="280" width="14" height="14" rx="3"/>
    <rect x="210" y="280" width="14" height="14" rx="3"/>
    <rect x="260" y="280" width="14" height="14" rx="3"/>
    <rect x="310" y="280" width="14" height="14" rx="3"/>

    <rect x="150" y="306" width="14" height="14" rx="3"/>
    <rect x="195" y="306" width="14" height="14" rx="3"/>
    <rect x="240" y="306" width="14" height="14" rx="3"/>
    <rect x="280" y="306" width="14" height="14" rx="3"/>
    <rect x="325" y="306" width="14" height="14" rx="3"/>
  </g>

  <!-- Center badge -->
  <circle cx="200" cy="200" r="32" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.15))"/>
  <circle cx="200" cy="200" r="28" fill="url(#qrGrad)"/>
  <text x="200" y="209" fill="#ffffff" font-family="Inter, sans-serif" font-weight="900" font-size="24" text-anchor="middle">₹</text>

  <!-- UPI Footer bar -->
  <rect x="24" y="340" width="352" height="38" rx="8" fill="#f1f5f9"/>
  <text x="200" y="364" fill="#334155" font-family="Inter, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
    Scan with GPay • PhonePe • Paytm • BHIM
  </text>
</svg>
