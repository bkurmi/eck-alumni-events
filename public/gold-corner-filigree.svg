<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="50" height="50" fill="none">
  <defs>
    <linearGradient id="goldCornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5ba"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cornerDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g filter="url(#cornerDropShadow)" stroke="url(#goldCornerGrad)" fill="url(#goldCornerGrad)">
    <!-- Corner Outer Accent Dot and Ring -->
    <circle cx="8" cy="8" r="2.5" stroke-width="1.2" fill="#fff5ba"/>
    <circle cx="16" cy="8" r="1.5"/>
    <circle cx="8" cy="16" r="1.5"/>
    
    <!-- Outer L-Brackets -->
    <path d="M 8 12 L 8 42" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 12 8 L 42 8" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <path d="M 13 13 L 13 32" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 13 13 L 32 13" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
    
    <!-- Top Horizontal Foliage & Scroll -->
    <path d="M 42 8 C 49 8, 56 6, 60 11 C 63 15, 59 20, 54 18 C 50 16, 51 11, 57 11" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 30 8 C 35 3, 42 2, 47 6 C 42 8, 37 9, 30 8 Z" stroke-width="0.8"/>
    <path d="M 48 9 C 53 11, 55 16, 51 18 C 47 16, 47 11, 48 9 Z" stroke-width="0.6"/>
    
    <!-- Left Vertical Foliage & Scroll -->
    <path d="M 8 42 C 8 49, 6 56, 11 60 C 15 63, 20 59, 18 54 C 16 50, 11 51, 11 57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 8 30 C 3 35, 2 42, 6 47 C 8 42, 9 37, 8 30 Z" stroke-width="0.8"/>
    <path d="M 9 48 C 11 53, 16 55, 18 51 C 16 47, 11 47, 9 48 Z" stroke-width="0.6"/>
    
    <!-- Central Diagonal Acanthus Palmette -->
    <path d="M 15 15 C 20 20, 25 25, 32 32 C 36 36, 38 42, 34 44 C 30 46, 26 42, 23 37 C 22 35, 21 30, 15 15 Z" stroke-width="1" stroke-linejoin="round"/>
    <path d="M 32 32 C 34 26, 42 23, 44 26 C 46 30, 42 34, 37 35 C 35 34, 33 33, 32 32 Z" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="28" cy="28" r="2"/>
    <circle cx="38" cy="38" r="2.2" fill="#fff5ba"/>
    <circle cx="45" cy="45" r="1.6"/>
    
    <!-- Inward Pointing Fleur-de-lis Leaf -->
    <path d="M 22 22 Q 38 38 50 50 Q 42 45 37 37 Q 30 30 22 22 Z" stroke-width="0.8"/>
    
    <!-- Delicate curls and tendrils -->
    <path d="M 22 13 Q 28 20 33 18 Q 30 13 22 13 Z" stroke-width="0.8"/>
    <path d="M 13 22 Q 20 28 18 33 Q 13 30 13 22 Z" stroke-width="0.8"/>
  </g>
</svg>
