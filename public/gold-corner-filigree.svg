<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="30%" stop-color="#dfb76c"/>
      <stop offset="70%" stop-color="#c59a3e"/>
      <stop offset="100%" stop-color="#916a1b"/>
    </linearGradient>
  </defs>

  <g stroke="url(#goldStem)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1. Corner Fleur-de-lis / Diamond Spearhead pointing to top-left corner -->
    <!-- Center diamond hub -->
    <polygon points="34,34 39,29 44,34 39,39" fill="url(#goldStem)" stroke-width="1.2"/>
    
    <!-- Outer Spearhead pointing to (12,12) -->
    <path d="M 34 34 Q 24 24 16 16 Q 22 28 34 34 Z" fill="url(#goldStem)" stroke-width="1"/>
    <polygon points="16,16 24,19 28,28 19,24" fill="url(#goldStem)" stroke-width="1"/>
    <circle cx="14" cy="14" r="1.8" fill="url(#goldStem)"/>

    <!-- Inner Spearhead pointing inward to (54,54) -->
    <path d="M 44 44 Q 50 50 56 56 Q 48 52 44 44 Z" fill="url(#goldStem)" stroke-width="1"/>
    <polygon points="46,46 54,49 57,57 49,54" fill="url(#goldStem)" stroke-width="1"/>

    <!-- Flanking wings / petals of corner fleur-de-lis -->
    <path d="M 31 31 C 24 28 18 35 24 41 C 28 45 34 40 34 34" stroke-width="1.8"/>
    <path d="M 31 31 C 28 24 35 18 41 24 C 45 28 40 34 34 34" stroke-width="1.8"/>

    <!-- 2. Horizontal Stem & Scrollwork (Top Branch) -->
    <!-- Main horizontal spine -->
    <path d="M 39 24 L 92 24" stroke-width="2"/>
    <circle cx="94" cy="24" r="2.2" fill="url(#goldStem)"/>

    <!-- Primary spiral volute on top branch curling down & in -->
    <path d="M 46 24 C 46 36 58 44 68 38 C 76 33 74 20 62 20 C 54 20 52 28 58 32 C 62 34 66 31 64 27" stroke-width="1.8"/>

    <!-- Secondary outer crest curl branching upward -->
    <path d="M 70 24 C 74 16 84 16 86 22 C 87 26 83 29 79 26" stroke-width="1.6"/>
    <circle cx="80" cy="26" r="1.4" fill="url(#goldStem)"/>

    <!-- Leaf accent under horizontal stem -->
    <path d="M 78 24 C 84 28 88 34 84 38 C 80 40 76 36 78 24 Z" fill="url(#goldStem)" stroke-width="1"/>

    <!-- 3. Vertical Stem & Scrollwork (Left Branch) -->
    <!-- Main vertical spine -->
    <path d="M 24 39 L 24 92" stroke-width="2"/>
    <circle cx="24" cy="94" r="2.2" fill="url(#goldStem)"/>

    <!-- Primary spiral volute on left branch curling right & in -->
    <path d="M 24 46 C 36 46 44 58 38 68 C 33 76 20 74 20 62 C 20 54 28 52 32 58 C 34 62 31 66 27 64" stroke-width="1.8"/>

    <!-- Secondary outer crest curl branching leftward -->
    <path d="M 24 70 C 16 74 16 84 22 86 C 26 87 29 83 26 79" stroke-width="1.6"/>
    <circle cx="26" cy="80" r="1.4" fill="url(#goldStem)"/>

    <!-- Leaf accent right of vertical stem -->
    <path d="M 24 78 C 28 84 34 88 38 84 C 40 80 36 76 24 78 Z" fill="url(#goldStem)" stroke-width="1"/>

    <!-- 4. Inner delicate tendril connecting the two branches -->
    <path d="M 44 38 C 50 44 44 50 38 44" stroke-width="1.2"/>
    <circle cx="41" cy="41" r="1.2" fill="url(#goldStem)"/>
  </g>
</svg>
